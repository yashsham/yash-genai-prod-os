general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  supported_call_types: ["completion", "acompletion", "chat_completion", "achat_completion"]
  similarity_threshold: 0.94

# Enterprise Network & URL Validation Defense (SSRF Protection)
user_url_validation: true
user_url_allowed_hosts: ["api.corp.internal"]

# Global Budget Enforcements
max_budget: 5000.0
budget_duration: "30d"

# Default Settings for Teams & Users
default_team_settings:
  - team_id: "default-app-team"
    max_budget: 500.0
    budget_duration: "30d"
    tpm_limit: 100000
    rpm_limit: 500

router_settings:
  provider_budget_config:
    openai:
      budget_limit: 2000.0
      time_period: "30d"
    anthropic:
      budget_limit: 2000.0
      time_period: "30d"
    anyscale:
      budget_limit: 1000.0
      time_period: "30d"

model_list:
  # Primary Strong Tier
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_budget: 1500.0
      budget_duration: "30d"

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 1500.0
      budget_duration: "30d"

  # Cost-Effective Weak / Fallback Tier
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_budget: 500.0
      budget_duration: "30d"

  - model_name: mixtral-8x7b
    litellm_params:
      model: anyscale/mistralai/Mixtral-8x7B-Instruct-v0.1
      api_key: os.environ/ANYSCALE_API_KEY
      max_budget: 500.0
      budget_duration: "30d"
